[package]
name = "valanium-onionize"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Встроенный Tor для Valanium: локальный SOCKS5 поверх Arti"

[dependencies]
arti-client = { version = "0.30.0", default-features = false, features = ["tokio", "rustls", "onion-service-client"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tor-rtcompat = { version = "0.30.0", features = ["tokio", "rustls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
